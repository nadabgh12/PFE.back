spring.datasource.url=jdbc:postgresql://localhost:5432/Ahmini
spring.datasource.username= postgres
spring.datasource.password= admin

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update

# App Properties
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs= 86400000


#logging.level.net.javaguides.springboot=DEBUG
#logging.level.org.springframework.transaction=TRACE
#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Activation du debug
logging.level.net.javaguides=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# Activation du logging détaillé
logging.level.org.springframework.security=DEBUG
logging.level.net.javaguides.springboot=DEBUG

# Configuration Hibernate
spring.jpa.show-sql=true

# Configuration des messages d'erreur
# Désactive la page d'erreur par défaut de Spring Boot
server.error.whitelabel.enabled=false
# Activer les détails d'erreur (seulement en développement)
server.error.include-message=always
server.error.include-stacktrace=always

# Configure le chemin des erreurs
server.error.path=/error

# Activation des méthodes Optional
spring.jpa.open-in-view=true

# Configuration email (exemple avec Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=monemail@gmail.com
spring.mail.password=123456789
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Activez cette option si vous utilisez Gmail avec 2FA
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com