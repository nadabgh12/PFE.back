<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erreur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Police d'écriture engagée -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-feminist: #9b59b6;  /* Violet pour l'égalité */
            --red-power: #e74c3c;        /* Rouge pour la lutte */
            --green-hope: #2ecc71;       /* Vert pour l'espoir */
            --gold-solidarity: #f1c40f;  /* Or pour la solidarité */
            --dark-text: #2c3e50;        /* Texte foncé accessible */
        }
        
        body {
            font-family: 'Raleway', sans-serif;
            background-color: #f9f1fe; /* Fond très clair violet */
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(155, 89, 182, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(231, 76, 60, 0.1) 0%, transparent 20%);
            color: var(--dark-text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
        }
        
        .alert-danger {
            background-color: white;
            border: 3px solid var(--purple-feminist);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.2);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--purple-feminist);
            font-weight: 700;
            position: relative;
            display: inline-block;
        }
        
        h1:after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 50px;
            height: 4px;
            background: linear-gradient(90deg, var(--purple-feminist), var(--red-power));
        }
        
        .btn-primary {
            background-color: var(--purple-feminist);
            border: none;
            padding: 10px 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            border-radius: 30px;
        }
        
        .btn-primary:hover {
            background-color: var(--red-power);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }
        
        /* Effet ruban féministe */
        .feminist-ribbon {
            position: fixed;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 100px 100px 0;
            border-color: transparent var(--purple-feminist) transparent transparent;
            z-index: 1000;
        }
        
        .feminist-ribbon:after {
            content: "✊";
            position: absolute;
            top: 20px;
            right: -90px;
            color: white;
            font-size: 1.5rem;
            transform: rotate(45deg);
        }
        
        /* Message d'encouragement */
        .solidarity-message {
            margin-top: 30px;
            padding: 15px;
            background-color: rgba(46, 204, 113, 0.1);
            border-left: 4px solid var(--green-hope);
            font-style: italic;
        }
        
        /* Animation douce */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .alert-danger {
            animation: pulse 3s infinite;
        }
    </style>
</head>
<body>
    <!-- Ruban féministe -->
    <div class="feminist-ribbon"></div>
    
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="alert alert-danger text-center">
                    <h1 class="text-danger">Erreur <span th:text="${status}">XXX</span></h1>
                    <p class="lead" th:text="${error}">Message d'erreur</p>
                    <p th:text="${message}">Détails supplémentaires</p>
                </div>
                
                <div class="text-center mt-4">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="bi bi-arrow-left"></i> Retour à l'accueil
                    </a>
                </div>
                
                <div class="solidarity-message mt-4">
                    <strong>Solidarité :</strong> Chaque erreur nous rend plus fortes ensemble. 
                    Persistons comme nos aïeules ont persisté.
                </div>
                
                <!-- Section optionnelle pour le debug -->
                <div th:if="${trace}" class="mt-4 p-3 bg-light rounded">
                    <h5 class="text-purple">Stack Trace :</h5>
                    <pre class="bg-white p-3 rounded" th:text="${trace}"></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Icones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</body>
</html>
